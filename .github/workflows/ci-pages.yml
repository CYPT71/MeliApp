name: CI & GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install test dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser UI and accessibility tests
        run: npm run test:e2e

      - name: Syntax checks
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Manual build smoke test
        run: npm run build

      - name: Reject obvious committed secrets
        shell: bash
        run: |
          if git grep -InE '(client_secret\s*[:=]|sk-[A-Za-z0-9_-]{20,}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY)' -- . ':!*.md'; then
            echo 'Potential secret detected in repository.'
            exit 1
          fi

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build static site with public OAuth client IDs
        env:
          MS_CLIENTID: ${{ secrets.MS_CLIENTID }}
          SPOTIFY_CLIENTID: ${{ secrets.SPOTIFY_CLIENTID }}
          SPOTIFY_SECRET_PRESENT: ${{ secrets.SPOTIFY_SECRET != '' && '1' || '' }}
        shell: bash
        run: |
          if [ -z "$MS_CLIENTID" ]; then
            echo "MS_CLIENTID is required in the github-pages environment."
            exit 1
          fi

          if [ -z "$SPOTIFY_CLIENTID" ]; then
            if [ -n "$SPOTIFY_SECRET_PRESENT" ]; then
              echo "SPOTIFY_SECRET is present but cannot be exposed in a static GitHub Pages app."
              echo "Add the public Spotify Client ID as SPOTIFY_CLIENTID. The Client Secret is intentionally unused with PKCE."
            else
              echo "SPOTIFY_CLIENTID is required in the github-pages environment."
            fi
            exit 1
          fi

          npm run build
          echo "Microsoft OAuth client ID injected into dist/."
          echo "Spotify OAuth client ID injected into dist/."

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
