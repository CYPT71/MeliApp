name: CI & GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Syntax checks
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Reject obvious committed secrets
        shell: bash
        run: |
          if grep -RInE --exclude-dir=.git --exclude='*.md' '(client_secret\s*[:=]|sk-[A-Za-z0-9_-]{20,}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY)' .; then
            echo 'Potential secret detected in repository.'
            exit 1
          fi

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject public OAuth client IDs
        env:
          MS_CLIENTID: ${{ secrets.MS_CLIENTID }}
          SPOTIFY_CLIENTID: ${{ secrets.SPOTIFY_CLIENTID }}
        shell: bash
        run: |
          if [ -z "$MS_CLIENTID" ]; then
            echo "MS_CLIENTID is required in the github-pages environment."
            exit 1
          fi

          node <<'NODE'
          const fs = require('node:fs');
          const microsoftClientId = String(process.env.MS_CLIENTID || '').trim();
          const spotifyClientId = String(process.env.SPOTIFY_CLIENTID || '').trim();

          const content = `// Generated by GitHub Actions at deployment time. Public OAuth client identifiers only.\nexport const config = Object.freeze({\n  microsoftClientId: ${JSON.stringify(microsoftClientId)},\n  microsoftTenant: "common",\n  spotifyClientId: ${JSON.stringify(spotifyClientId)}\n});\n`;

          fs.writeFileSync('js/config.js', content, 'utf8');
          NODE

          echo "Microsoft OAuth client ID injected."
          if [ -n "$SPOTIFY_CLIENTID" ]; then
            echo "Spotify OAuth client ID injected."
          else
            echo "Spotify client ID not configured yet; Spotify connection will remain unavailable."
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
